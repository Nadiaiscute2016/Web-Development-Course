<!DOCTYPE html>
<html>
<head>
  <title>My Birthday Countdown Checker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      color: #3b2f2f;
      text-align: center;
    }

    .birthday-card {
      width: 520px;
      background-color: white;
      border: 4px solid #ff6f91;
      border-radius: 20px;
      margin: 40px auto;
      padding: 25px;
      box-shadow: 0 0 20px #ff8fab;
    }

    h1 {
      color: #ff477e;
      font-size: 34px;
    }

    .emoji {
      font-size: 60px;
    }

    .info-box {
      background-color: #fff0f5;
      border: 2px dashed #ff6f91;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
    }

    button {
      background-color: #ff477e;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #d6336c;
    }

    #daysBox {
      font-size: 42px;
      font-weight: bold;
      color: #7209b7;
    }

    #result {
      font-size: 17px;
      line-height: 1.6;
    }

    #countdown {
      color: #ff477e;
      font-weight: bold;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="birthday-card">

    <div class="emoji">🎉🎂🎁</div>

    <h1>My Birthday Countdown Checker</h1>

    <p>
      Click the button to check how many days are left for the birthday celebration.
    </p>

    <button onclick="checkBirthday()">Check Birthday Countdown</button>

    <h2>Days Left</h2>
    <div id="daysBox">?</div>

    <div class="info-box">
      <h2>Birthday Result</h2>
      <p id="result"></p>
    </div>

    <div class="info-box">
      <h2>Countdown Review</h2>
      <p id="countdown"></p>
    </div>

  </div>

  <script>
    function checkBirthday() {

      // Assigned string variables based on your instructions
      let birthdayGift = "Barbie doll house";
      
      // Detailed, structured schedule template using string concatenation
      let birthdayPlan = "Go to Acacus Water Park at 11 am, come back at 5 pm.<br>";
      birthdayPlan += "<strong>✨ Full Timeline Schedule:</strong><br>";
      birthdayPlan += "• 11:00 AM — Arrive at Acacus Water Park and find a spot<br>";
      birthdayPlan += "• 11:30 AM — Ride the massive water slides and swim in the wave pool<br>";
      birthdayPlan += "• 1:00 PM — Lunch time! Eat burgers, crispy fries, and ice cream<br>";
      birthdayPlan += "• 2:30 PM — Relax in the lazy river and play water games<br>";
      birthdayPlan += "• 4:00 PM — Change clothes, dry off, and open the Barbie doll house gift<br>";
      birthdayPlan += "• 5:00 PM — Head back home after a perfect birthday!";

      // Block Scope variables
      const studentName = "Nadia";
      
      let message = "";
      let countdownText = "";

      // Overriding the Date Object with your fixed target date structure
      let today = new Date(2026, 7, 21); // Month index 7 is August 21, 2026
      let birthday = new Date(2027, 0, 20); // Month index 0 is January 20, 2027

      let timeDifference = birthday - today;
      let daysLeft = Math.ceil(timeDifference / (1000 * 60 * 60 * 24));

      // Conditional check for statement output
      if (daysLeft === 0) {
        message = "Happy Birthday, " + studentName + "! Today is your special day!";
      } else if (daysLeft <= 7) {
        message = "Your birthday is almost here, " + studentName + "!";
      } else {
        message = "Keep counting, " + studentName + "! Your birthday is coming soon.";
      }

      // String Concatenation output display updating inner text elements
      let finalMessage = "Student Name: " + studentName + "<br>";
      finalMessage = finalMessage + "Today's Date: " + today.toDateString() + "<br>";
      finalMessage = finalMessage + "Birthday Date: " + birthday.toDateString() + "<br>";
      finalMessage = finalMessage + "Message: " + message + "<br><br>";

      finalMessage = finalMessage + "Birthday Gift: " + birthdayGift + "<br><br>";
      finalMessage = finalMessage + "Birthday Plan: <br>" + birthdayPlan;

      document.getElementById("daysBox").innerHTML = daysLeft;
      document.getElementById("result").innerHTML = finalMessage;

      // While Loop Execution
      let day = 1;

      while (day <= 5) {
        countdownText = countdownText + "Countdown check " + day;
        countdownText = countdownText + ": Birthday excitement loading...<br>";
        day++;
      }

      document.getElementById("countdown").innerHTML = countdownText;
    }
  </script>

</body>
</html>
