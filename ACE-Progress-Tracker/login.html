<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ACE Progress Tracker™</title>

  <!-- Global -->
<link rel="stylesheet" href="css/style.css">

<!-- Authentication -->
<link rel="stylesheet" href="css/auth.css">

<!-- Animations -->
<link rel="stylesheet" href="css/animations.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">
</head>

<body>

    <header class="top-header">
        <div class="logo">
            📘 ACE Progress Tracker™
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="signup.html">Create Account</a>
        </nav>
    </header>

    <main class="auth-page">

        <div class="auth-card">

            <h1>Welcome Back!</h1>

            <p class="auth-subtitle">
                Sign in to continue your learning journey.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#" class="forgot-link">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit" class="primary-btn auth-btn">
                    Login
                </button>

            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <button class="secondary-btn auth-btn">
                Continue as Guest
            </button>

            <p class="switch-page">
                Don't have an account?

                <a href="signup.html">
                    Create one
                </a>
            </p>

        </div>

    </main>

   <!-- ==========================================
     ACE Progress Tracker™
     Dashboard JavaScript Loader
========================================== -->

<script src="js/app.js"></script>

<script src="js/storage.js"></script>

<script src="js/auth.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/dashboard-v2.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="js/charts.js"></script>
</body>

</html>
