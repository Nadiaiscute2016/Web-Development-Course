<!-- MAIN -->

<main class="content">



<header class="topbar">


<h2>
📚 My PACE Database
</h2>


</header>









<!-- ADD PACE FORM -->


<section class="pace-form-card">


<h2>
➕ Add New PACE
</h2>




<div class="form-grid">



<div>

<label>
Subject
</label>


<select id="paceSubject">


<option>
Mathematics
</option>


<option>
English
</option>


<option>
Science
</option>


<option>
Social Studies
</option>


<option>
Bible
</option>


</select>


</div>






<div>

<label>
PACE Number
</label>


<input

id="paceNumber"

placeholder="Example: Math 1025">


</div>








<div>

<label>
Score (%)
</label>


<input

id="paceScore"

type="number"

min="0"

max="100"

placeholder="95">


</div>








<div>

<label>
Status
</label>


<select id="paceStatus">


<option>
Completed
</option>


<option>
In Progress
</option>


<option>
Started
</option>


</select>


</div>








<div>

<label>
Completion Date
</label>


<input

id="paceDate"

type="date">


</div>



</div>








<label>

Notes (optional)

</label>


<textarea

id="paceNotes"

placeholder="Add notes about your progress...">

</textarea>








<button

class="primary-btn"

onclick="addPACE()">


Save PACE 📚


</button>



</section>









<!-- SEARCH -->


<section class="search-box">


<input

id="searchPACE"

placeholder="Search PACEs..."

oninput="displayPACEs()">



</section>









<!-- DATABASE -->


<section class="pace-list-card">


<h2>
📖 Completed & Active PACEs
</h2>



<div id="paceList">


<p>
No PACEs added yet.
</p>


</div>


</section>

</div>
