<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Student Profile | ACE Tracker</title>


<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/darkmode.css">

</head>


<body>


<div class="app">



<aside class="sidebar">


<div class="logo">

<div class="logo-icon">
👤
</div>

<div>

<h2>
ACE Tracker
</h2>

<small>
Student Portal
</small>

</div>

</div>



<ul class="menu">


<li>
<a href="dashboard.html">
🏠 Dashboard
</a>
</li>


<li>
<a href="paces.html">
📚 PACEs
</a>
</li>


<li>
<a href="goals.html">
🎯 Goals
</a>
</li>


<li>
<a href="achievements.html">
🏆 Achievements
</a>
</li>


<li class="active">
<a href="profile.html">
👤 Profile
</a>
</li>


<li>
<a href="settings.html">
⚙️ Settings
</a>
</li>


</ul>


</aside>







<main class="content">



<header class="topbar">

<h2>
👤 Student Profile
</h2>

</header>








<section class="profile-card">



<img

id="profilePreview"

class="profile-image"

src="assets/images/profile.png"

alt="Profile Picture">





<label class="upload-btn">


📷 Upload Picture


<input

type="file"

id="profileUpload"

accept="image/*"

hidden>


</label>



</section>









<section class="profile-form">



<label>

Full Name

</label>


<input

id="studentName"

placeholder="Your name">





<label>

Student ID (Optional)

</label>


<input

id="studentID"

placeholder="Example: ACE001">





<label>

Level / Class

</label>


<input

id="studentClass"

placeholder="Example: Grade 8">





<label>

Learning Preference

</label>


<select id="learningPreference">


<option>

Visual Learning

</option>


<option>

Reading & Notes

</option>


<option>

Practice Questions

</option>


<option>

Hands-on Learning

</option>


</select>







<label>

Theme Preference

</label>


<select id="themePreference">


<option value="light">

Light

</option>


<option value="dark">

Dark

</option>


</select>







<button

class="primary-btn"

onclick="saveProfile()">


Save Profile


</button>



</section>





</main>


</div>





<script src="js/storage.js"></script>

<script src="js/profile.js"></script>


</body>

</html>
