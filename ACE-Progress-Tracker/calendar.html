<main class="content">


<header class="topbar">

<h2>
📅 PACE Calendar
</h2>

</header>









<section class="calendar-summary">


<div class="calendar-card">

<h3>
Weekly Target
</h3>


<h1 id="weeklyTarget">

0 PACEs

</h1>

</div>





<div class="calendar-card">

<h3>
Completed Days
</h3>


<h1 id="completedDays">

0

</h1>

</div>





<div class="calendar-card">

<h3>
Study Streak
</h3>


<h1 id="calendarStreak">

🔥 0

</h1>

</div>


</section>








<section class="schedule-card">


<h2>
📚 Study Schedule
</h2>



<input

id="studyTask"

placeholder="Example: Math PACE 1025">



<input

id="studyDate"

type="date">





<button

class="primary-btn"

onclick="addStudyTask()">

Add Schedule

</button>



<div id="scheduleList">

</div>


</section>









<section class="completed-card">


<h2>
✅ Completed Study Days
</h2>



<button

onclick="completeStudyDay()">

Mark Today Complete

</button>



<div id="completedList">

</div>


</section>







</main>


</div>

<script src="js/calendar.js"></script>
