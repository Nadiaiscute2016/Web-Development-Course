<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ACE Progress Tracker™</title>

    <!-- Global -->
<link rel="stylesheet" href="css/style.css">

<!-- Authentication -->
<link rel="stylesheet" href="css/auth.css">

<!-- Animations -->
<link rel="stylesheet" href="css/animations.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">
</head>

<body>

    <header class="top-header">

        <div class="logo">
            📘 ACE Progress Tracker™
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main class="auth-page">

        <div class="auth-card signup-card">

            <h1>Create Your Account</h1>

            <p class="auth-subtitle">
                Start tracking your ACE learning journey today.
            </p>

            <form id="signupForm">

                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required>

                </div>


                <div class="form-group">

                    <label for="grade">
                        Grade / Level
                    </label>

                    <select id="grade" required>

                        <option value="">
                            Select Grade
                        </option>

                        <option>Grade 1</option>
                        <option>Grade 2</option>
                        <option>Grade 3</option>
                        <option>Grade 4</option>
                        <option>Grade 5</option>
                        <option>Grade 6</option>
                        <option>Grade 7</option>
                        <option>Grade 8</option>
                        <option>Grade 9</option>
                        <option>Grade 10</option>
                        <option>Grade 11</option>
                        <option>Grade 12</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="goal">
                        Weekly PACE Goal
                    </label>

                    <input
                        type="number"
                        id="goal"
                        min="1"
                        max="20"
                        value="5"
                        required>

                </div>


                <button
                    type="submit"
                    class="primary-btn auth-btn">

                    Create Account

                </button>

            </form>


            <div class="auth-divider">

                <span>Already have an account?</span>

            </div>

            <a
                href="login.html"
                class="secondary-btn auth-btn">

                Login

            </a>

        </div>

    </main>


    <!-- ==========================================
     ACE Progress Tracker™
     Dashboard JavaScript Loader
========================================== -->

<script src="js/app.js"></script>

<script src="js/storage.js"></script>

<script src="js/auth.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/dashboard-v2.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="js/charts.js"></script>

</body>

</html>
