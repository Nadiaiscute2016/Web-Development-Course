<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadia's Bank App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Centered White Card -->
    <div class="bank-card">
        
        <!-- Title targeted by CSS text-transform -->
        <h1 class="bank-title">Nadia's bank</h1>
        
        <!-- Underlined labels -->
        <label class="underlined-label">Available balance</label>
        <p class="balance-display">$1,000,000.00</p>

        <label class="underlined-label" for="amount">Enter amount</label>
        <input type="number" id="amount" placeholder="0.00">
        
        <!-- Colored side-by-side buttons with individual shadows -->
        <div class="button-group">
            <button type="button" class="btn btn-credit">Credit</button>
            <button type="button" class="btn btn-debit">Debit</button>
        </div>

        <!-- Small, grey, struck-through disclaimer note -->
        <p class="disclaimer-note">Terms and conditions apply</p>

    </div>

</body>
</html>
