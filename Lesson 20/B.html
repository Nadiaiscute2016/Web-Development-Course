<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Using Functions</title>
</head>
<body>

<h2>Multiplication Using Functions</h2>

<p id="result"></p>

<script>
    function multiply(num1, num2) {
        return num1 * num2;
    }

    let answer = multiply(8, 5);

    document.getElementById("result").innerHTML =
        "8 × 5 = " + answer;
</script>

</body>
</html>
